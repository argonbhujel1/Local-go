{% extends "base.html" %}
{% block title %}Send Parcel{% endblock %}
{% block body_class %}has-bottom-nav{% endblock %}

{% block content %}
<div class="page-header">
  <h1>📦 Send Parcel</h1>
</div>
<form id="parcel-form" class="form-card">
  <div class="form-group">
    <label>Pickup Address</label>
    <input type="text" name="pickup_address" required>
  </div>
  <div class="form-group">
    <label>Delivery Address</label>
    <input type="text" name="destination_address" required>
  </div>
  <div class="form-group">
    <label>Receiver Name</label>
    <input type="text" name="receiver_name" required>
  </div>
  <div class="form-group">
    <label>Receiver Phone</label>
    <input type="tel" name="receiver_phone" required>
  </div>
  <div class="form-group">
    <label>Parcel Type</label>
    <select name="parcel_type">
      <option value="SMALL_PACKAGE">Small package</option>
      <option value="DOCUMENTS">Documents</option>
      <option value="CLOTHING">Clothing</option>
      <option value="ELECTRONICS">Electronics</option>
      <option value="GROCERY">Grocery</option>
      <option value="GIFTS">Gifts</option>
      <option value="LOCAL_PRODUCTS">Local products</option>
      <option value="OTHER">Other</option>
    </select>
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea name="description" rows="2"></textarea>
  </div>
  <div class="form-group">
    <label>Approx. Weight (kg)</label>
    <input type="number" name="weight" step="0.1" min="0">
  </div>
  <div class="form-group">
    <label>Special Instructions</label>
    <textarea name="special_instructions" rows="2"></textarea>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Create Parcel Order</button>
</form>
{% endblock %}

{% block bottom_nav %}
<nav class="bottom-nav">
  <a href="{{ url_for('passenger.dashboard') }}"><span>🏠</span>Home</a>
  <a href="{{ url_for('passenger.book_ride') }}"><span>🚕</span>Rides</a>
  <a href="{{ url_for('passenger.orders') }}" class="active"><span>📋</span>Orders</a>
  <a href="{{ url_for('passenger.messages') }}"><span>💬</span>Messages</a>
  <a href="{{ url_for('passenger.profile') }}"><span>👤</span>Profile</a>
</nav>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('parcel-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd.entries());
  const res = await fetch('/api/parcels/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token() }}'},
    body: JSON.stringify(data)
  });
  const json = await res.json();
  if (json.ok) {
    alert('Parcel created! Tracking: ' + json.tracking_number + '\nFare: Rs. ' + json.total_fare);
    location.href = '{{ url_for("passenger.orders") }}';
  } else {
    alert(json.error || 'Failed');
  }
});
</script>
{% endblock %}
