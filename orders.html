{% extends "base.html" %}
{% block title %}Orders{% endblock %}
{% block content %}
<div class="page-header"><h1>Orders</h1></div>
{% for o in orders %}
  <div class="card"><strong>{{ o.order_id }}</strong> · {{ o.status }} · Rs.{{ o.total }}</div>
{% else %}
  <p class="muted">No orders.</p>
{% endfor %}
{% endblock %}
