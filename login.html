{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Login to LocalGo</p>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" name="phone" placeholder="98XXXXXXXX" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <label class="checkbox">
        <input type="checkbox" name="remember"> Remember me
      </label>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="auth-footer">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    <p class="auth-footer small"><a href="{{ url_for('public.index') }}">← Back home</a></p>
  </div>
</div>
{% endblock %}
